name: release

# Cuts a release from a `vX.Y.Z` tag: static linux binaries for amd64 and arm64
# with SHA256SUMS, a multi-arch image at ghcr.io/wayju/fleetwatch tagged X.Y.Z
# and X.Y, a GitHub Release, and signed build provenance for the binaries and
# the image. The tag must match cmd/fleetwatch/VERSION and sit on main.
#
# While the repository is private the release is published as a prerelease
# without provenance: GitHub stores attestations only for public repositories
# on a personal account, so a private preview build would otherwise fail.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Jobs widen this only as far as they need.
permissions:
  contents: read

env:
  GO_VERSION: "1.27.3"
  IMAGE: ghcr.io/wayju/fleetwatch

jobs:
  # Tests and compiles. No write scope: it cannot publish anything.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      minor: ${{ steps.ver.outputs.minor }}
      sha: ${{ steps.ver.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag against VERSION and main
        id: ver
        run: |
          set -eu
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1 ;;
          esac
          version="$(tr -d '[:space:]' < cmd/fleetwatch/VERSION)"
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($version)"; exit 1; }
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::VERSION $version is not X.Y.Z"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tagged commit is not on main"; exit 1; }
          {
            echo "version=$version"
            echo "minor=${version%.*}"
            echo "sha=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          # No build or module cache: the release binaries are built from
          # source alone, never from entries a branch run could have written.
          cache: false

      - name: Vet and test
        run: |
          go vet ./...
          go test -race ./...

      - name: Cross-compile and checksum
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          set -eu
          mod="$(sed -n 's/^module //p' go.mod | tr -d '[:space:]')"
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X $mod/internal/core.BuildVersion=$VERSION -X $mod/internal/core.BuildCommit=$SHA" \
              -o "dist/fleetwatch-linux-$arch" ./cmd/fleetwatch
          done
          (cd dist && sha256sum fleetwatch-linux-* > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  image:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/

      - name: Verify the artifact checksums
        run: cd dist && sha256sum -c SHA256SUMS

      # The emulator and BuildKit images are pinned by digest: both run in a job
      # that holds the publish scopes, and the attestation vouches for their output.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v9.2.2@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6
          cache-image: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the multi-arch image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_COMMIT=${{ needs.build.outputs.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.build.outputs.version }}
            ${{ env.IMAGE }}:${{ needs.build.outputs.minor }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build.outputs.version }}

      - name: Attest the image provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    needs: [build, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/

      - name: Verify the artifact checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Attest the binaries
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/fleetwatch-linux-amd64
            dist/fleetwatch-linux-arm64
            dist/SHA256SUMS

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -eu
          # A published release is never overwritten: a rerun that finds it
          # fails, and a bad release is fixed by a new version.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists; assets are not replaced"
            exit 1
          fi
          pre=()
          [ "$PRIVATE" = "true" ] && pre=(--prerelease)
          gh release create "$TAG" dist/* --verify-tag "${pre[@]}" --title "FleetWatch $VERSION" --generate-notes
