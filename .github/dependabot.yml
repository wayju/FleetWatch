# Weekly update PRs for the Go module, the pinned GitHub Actions (each is held
# by full commit SHA with a version comment, which Dependabot rewrites together)
# and the Dockerfile base images (held by digest, as ARG defaults feeding FROM).
# A 7-day cooldown keeps a just-published release from being proposed at once.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(docker)"
